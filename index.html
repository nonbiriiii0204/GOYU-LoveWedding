<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="color-scheme" content="light">
<title>五悠日和 — 今日、ふたりの日</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap">
<style>
  /* 配色：白 / 粉（偏紅）/ 淺橘 / 淺藍 / 天藍（偏紫） */
  :root{
    --white:#fffdfb; --pink:#f4a0aa; --pink-deep:#e8798a; --pink-pale:#fde3e6;
    --orange:#fbd2a6; --orange-pale:#fdebd6; --blue:#cde8f6; --blue-pale:#eaf4fb;
    --sky:#92aaf2; --sky-deep:#6a82d8; --ink:#3e4478; --ink-dim:#6f76a8;
    --font:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;background:var(--blue-pale);color:var(--ink);font-family:var(--font);overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
  #hud{width:100%;max-width:960px;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;font-size:15px}
  #title{font-weight:700;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #hud .r{display:flex;align-items:center;gap:10px;white-space:nowrap}
  #hud b{color:var(--pink-deep)}
  #again{font:inherit;font-size:14px;color:var(--ink);background:var(--white);border:2px solid var(--pink);border-radius:999px;padding:4px 12px;cursor:pointer}
  #again:focus-visible,.opt:focus-visible,#sBtn:focus-visible,#mClose:focus-visible,.fl:focus-visible,.x:focus-visible,.go:focus-visible{outline:3px solid var(--sky-deep);outline-offset:2px}
  #stage{position:relative;flex:1 1 0;min-height:0;width:100%;max-width:960px;background:var(--white);border:3px solid var(--pink);border-radius:10px;overflow:hidden;box-shadow:0 6px 0 var(--blue)}
  #stage.fit{flex:none;aspect-ratio:20/13;max-height:calc(100% - 52px)}
  #cv{position:absolute;inset:0;width:100%;height:100%}
  canvas{display:block;width:100%;height:100%}
  #pad{position:absolute;left:12px;bottom:12px;width:132px;height:132px;display:none;touch-action:none}
  #pad button{position:absolute;width:44px;height:44px;border:2px solid var(--pink);background:rgba(255,253,251,.85);color:var(--ink);font:inherit;font-size:16px;border-radius:12px;touch-action:none}
  #pad button.on{background:var(--pink)}
  #pad .u{left:44px;top:0}#pad .d{left:44px;bottom:0}#pad .l{left:0;top:44px}#pad .r{right:0;top:44px}
  @media (pointer:coarse){#pad{display:block}}
  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(62,68,120,.45);z-index:5}
  .card{width:100%;max-width:520px;max-height:100%;overflow:auto;background:var(--white);border:3px solid var(--pink);border-radius:16px;box-shadow:0 8px 0 var(--blue);padding:18px;display:flex;flex-direction:column;gap:12px}
  .card h2{margin:0;font-size:24px;color:var(--pink-deep)}
  .card p{margin:0;font-size:17px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}
  .card img.pic{width:100%;max-height:44vh;object-fit:contain;background:var(--blue-pale);border-radius:10px;border:2px solid var(--blue)}
  .lab{font-size:14px;color:var(--ink-dim);letter-spacing:.08em}
  .pick{display:flex;flex-wrap:wrap;gap:10px}
  .opt{flex:0 1 92px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;font:inherit;font-size:15px;color:var(--ink);background:var(--white);border:2px solid var(--blue);border-radius:12px;cursor:pointer}
  .opt[aria-pressed="true"]{border-color:var(--pink-deep);background:var(--pink-pale);box-shadow:0 0 0 2px var(--pink)}
  .opt img,.opt canvas{width:auto;height:72px;max-width:100%}
  .card button.go{align-self:flex-end;font:inherit;font-size:17px;font-weight:700;padding:9px 26px;background:var(--pink);color:var(--ink);border:0;border-radius:999px;cursor:pointer;box-shadow:0 3px 0 var(--pink-deep)}

  /* 抽籤（捧花） */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .x{flex:none;width:44px;height:44px;font:inherit;font-size:20px;line-height:1;color:var(--ink);background:var(--white);border:2px solid var(--pink);border-radius:50%;cursor:pointer}
  .bouquet{width:100%;max-width:340px;margin:0 auto}
  .bouquet svg{display:block;width:100%;height:auto;overflow:visible}
  .fl{cursor:pointer;outline:none}
  .fl .hit{fill:transparent}
  .fl .sway{animation:sway 3.4s ease-in-out infinite;animation-delay:var(--d,0s)}
  .fl .pop{transition:transform .5s cubic-bezier(.3,.8,.3,1),opacity .5s ease-out}
  .fl:hover .pop,.fl:focus-visible .pop{transform:scale(1.14)}
  .fl:focus-visible .hit{stroke:var(--sky-deep);stroke-width:3}
  .fl.pull{pointer-events:none}
  .fl.pull .pop{transform:translateY(-70px) rotate(24deg) scale(1.6);opacity:0}
  /* 轉場與回饋 */
  .overlay:not([hidden]){animation:ovIn .28s ease-out both}
  .overlay:not([hidden]) .card{animation:cardIn .42s cubic-bezier(.2,.9,.3,1.12) both}
  .overlay.out{animation:ovOut .23s ease-in both}
  .overlay.out .card{animation:cardOut .23s ease-in both}
  @keyframes ovIn{from{opacity:0}to{opacity:1}}
  @keyframes ovOut{from{opacity:1}to{opacity:0}}
  @keyframes cardIn{from{transform:translateY(26px) scale(.94);opacity:0}to{transform:none;opacity:1}}
  @keyframes cardOut{from{transform:none;opacity:1}to{transform:translateY(14px) scale(.96);opacity:0}}
  #lPick:not([hidden]),#lResult:not([hidden]),#lDone:not([hidden]),#cIntro:not([hidden]),#cEnd:not([hidden]),#cPlay:not([hidden]),#cBoard:not([hidden]){animation:viewIn .32s ease-out both}
  @keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .card button.go,.x,#again,.opt,#pad button{transition:transform .12s ease-out,box-shadow .12s ease-out,background-color .15s}
  .card button.go:active,.x:active,#again:active{transform:scale(.93)}
  .card button.go:hover{box-shadow:0 5px 0 var(--pink-deep);transform:translateY(-1px)}
  .opt:active{transform:scale(.95)}
  #wipe{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at var(--wx,50%) var(--wy,50%),var(--pink-pale) 0,var(--pink) 55%);pointer-events:none;clip-path:circle(0 at var(--wx,50%) var(--wy,50%))}
  #wipe.in{clip-path:circle(150% at var(--wx,50%) var(--wy,50%));transition:clip-path .42s cubic-bezier(.65,0,.35,1)}
  #wipe.out{clip-path:circle(150% at var(--wx,50%) var(--wy,50%));opacity:0;transition:opacity .4s ease-out}
  @media (prefers-reduced-motion:reduce){.overlay:not([hidden]),.overlay:not([hidden]) .card,.overlay.out,.overlay.out .card,#lPick,#lResult,#lDone,#cIntro,#cEnd,#cPlay{animation:none!important}.card button.go,.x,#again,.opt{transition:none}}
  /* 排行榜 */
  .namebox{width:100%;display:flex;flex-direction:column;gap:6px}
  .namebox input{width:100%;font:inherit;font-size:18px;color:var(--ink);background:var(--white);border:2px solid var(--blue);border-radius:10px;padding:10px 12px;-webkit-user-select:text;user-select:text}
  .namebox input:focus{outline:3px solid var(--sky-deep);outline-offset:1px;border-color:var(--sky)}
  .btnrow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
  .card button.ghost{font:inherit;font-size:16px;padding:8px 18px;color:var(--ink);background:var(--white);border:2px solid var(--pink);border-radius:999px;cursor:pointer;transition:transform .12s ease-out}
  .card button.ghost:active{transform:scale(.93)}
  .ghost:focus-visible{outline:3px solid var(--sky-deep);outline-offset:2px}
  .board{list-style:none;margin:0;padding:0;width:100%;max-height:min(50vh,360px);overflow:auto;border:2px solid var(--blue);border-radius:10px;background:var(--white);-webkit-overflow-scrolling:touch;touch-action:pan-y}
  .board:empty{display:none}
  .board li{display:grid;grid-template-columns:2.6em 1fr auto;gap:8px;align-items:center;padding:8px 12px;font-size:16px;border-bottom:1px solid var(--blue-pale)}
  .board li:last-child{border-bottom:0}
  .board .rk{color:var(--ink-dim);font-weight:700;text-align:center}
  .board li:nth-child(-n+3) .rk{color:var(--pink-deep);font-size:18px}
  .board .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .board .sc{font-weight:700;color:var(--pink-deep)}
  .board li.me{background:var(--pink-pale);box-shadow:inset 4px 0 0 var(--pink-deep)}
  /* 接接樂 */
  .cgame{max-width:380px}
  .chud{display:flex;justify-content:space-between;align-items:center;font-size:17px;font-weight:700;padding:0 2px 6px}
  .chud b{color:var(--pink-deep);font-size:21px}
  #cLives{letter-spacing:2px;color:var(--pink-deep);min-width:3.6em;text-align:right}
  #cTime{color:var(--ink-dim)}
  #cCv{display:block;width:100%;height:auto;aspect-ratio:320/420;background:var(--blue-pale);border:2px solid var(--blue);border-radius:10px;touch-action:none}
  .ctip{text-align:center;padding-top:6px}
  .big{font-size:52px;font-weight:700;color:var(--pink-deep);line-height:1;animation:flwIn .5s cubic-bezier(.2,.9,.3,1.2) both}
  @keyframes sway{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg)}}
  .res .flw{animation:flwIn .55s cubic-bezier(.2,.9,.3,1.2) both}
  .slip{width:100%;display:flex;flex-direction:column;gap:10px;align-items:center;padding:16px 16px 14px;background:var(--orange-pale);border:2px solid var(--orange);border-top:7px solid var(--pink-deep);border-radius:6px;box-shadow:0 4px 0 var(--blue);animation:slipIn .5s .15s cubic-bezier(.2,.8,.3,1) both}
  .slip h2{letter-spacing:.35em;padding-left:.35em}
  @keyframes flwIn{from{transform:translateY(40px) rotate(-30deg) scale(.4);opacity:0}to{transform:none;opacity:1}}
  @keyframes slipIn{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
  @media (prefers-reduced-motion:reduce){.fl .sway,.res .flw,.slip{animation:none}.fl .pop{transition:none}}
  .res{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
  .res p{text-align:left;width:100%}
  .res .flw{height:84px;width:auto}
  .res button.go{align-self:center}
  #toast{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--white);border:2px solid var(--sky);border-radius:12px;padding:8px 14px;font-size:14px;max-width:90%;z-index:9}

  /* ===== 全站：Noto Sans TC、和紙感的細緻介面 ===== */
  :root{--line:rgba(217,100,126,.32);--rose:#d9647e}
  html,body,button,input{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif}
  html,body{font-size:16px;font-weight:400}
  #title{font-size:16px;font-weight:700;letter-spacing:.1em}
  #hud b{font-weight:700}
  #stage{border:0;border-radius:16px;background:var(--blue-pale);box-shadow:0 18px 40px -20px rgba(44,48,86,.5),0 0 0 5px #fffdfb,0 0 0 6px var(--line)}
  #again{height:36px;padding:0 18px;font-size:14px;letter-spacing:.12em;color:#4a5080;background:#fff;border:1px solid var(--line);border-radius:999px;box-shadow:0 4px 10px -6px rgba(44,48,86,.4)}
  #again:hover{background:#fff0f3}
  .opt{border:1px solid var(--line);border-radius:16px;background:#fff;font-size:14px;letter-spacing:.08em;padding:10px 8px;box-shadow:0 6px 14px -10px rgba(44,48,86,.45)}
  .opt:hover{transform:translateY(-2px)}
  .opt[aria-pressed="true"]{border-color:var(--rose);background:#fff0f3;box-shadow:0 0 0 3px rgba(240,143,162,.35),0 8px 16px -10px rgba(212,96,122,.6)}
  #pad button{border:1px solid var(--line);border-radius:50%;background:rgba(255,255,255,.85);color:#4a5080;font-size:15px;box-shadow:0 4px 10px -4px rgba(44,48,86,.35)}
  #pad button.on{background:#f08fa2;color:#fff}
  #toast{border:1px solid var(--line);border-radius:14px;background:#fff;color:#4a5080;box-shadow:0 10px 24px -12px rgba(44,48,86,.5)}
  .tw .rest{visibility:hidden}
  #lotCv{display:block;width:100%;height:auto;aspect-ratio:170/193}
  #lotCv:focus-visible{outline:3px solid var(--sky-deep);outline-offset:2px}
  .bouquet{max-width:320px}
  #sText{text-align:center}

  /* ===== 互動視窗（鳥居／神社抽籤／接捧花）：和紙＋細線框的精緻風格 ===== */
  #start,#modal,#lot,#catch{--serif:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;--sf:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;--rose:#d9647e;--rose-lt:#f08fa2;--line:rgba(217,100,126,.32);--gold:#c9a24a;
    font-family:var(--sf);background:rgba(44,48,86,.5);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px)}
  #start .card,#modal .card,#lot .card,#catch .card{position:relative;border:0;border-radius:22px;clip-path:none;padding:34px 30px 28px;gap:16px;
    background:radial-gradient(130% 55% at 50% 0%,#fff0f3 0,rgba(255,240,243,0) 65%),linear-gradient(180deg,#fffefd,#fff8f5);
    box-shadow:0 30px 70px -18px rgba(44,48,86,.55),0 2px 6px rgba(44,48,86,.12),inset 0 0 0 1px rgba(255,255,255,.9),inset 0 0 0 9px #fffdfb,inset 0 0 0 10px var(--line)}
  #start .card::before,#modal .card::before,#lot .card::before,#catch .card::before{content:"";position:sticky;top:-20px;display:block;height:0;margin:-10px auto 0;pointer-events:none}
  #start .card h2,#modal .card h2,#lot .card h2,#catch .card h2{font-family:var(--serif);font-weight:700;font-size:25px;letter-spacing:.16em;color:#3e4478;margin:0}
  #start .card h2,#modal .card h2{text-align:center;padding-left:.16em}
  #start .card h2::after,#modal .card h2::after{content:"";display:block;height:9px;margin:14px auto 2px;width:150px;
    background:radial-gradient(circle,var(--rose) 0 2.6px,transparent 3.2px) center/9px 9px no-repeat,
      radial-gradient(circle,var(--gold) 0 1.4px,transparent 2px) calc(50% - 15px) center/5px 5px no-repeat,
      radial-gradient(circle,var(--gold) 0 1.4px,transparent 2px) calc(50% + 15px) center/5px 5px no-repeat,
      linear-gradient(90deg,transparent,var(--line)) left center/calc(50% - 24px) 1px no-repeat,
      linear-gradient(270deg,transparent,var(--line)) right center/calc(50% - 24px) 1px no-repeat}
  #start .card h2:empty,#modal .card h2:empty{display:none}
  #start .card p,#modal .card p,#lot .card p,#catch .card p{font-size:16px;line-height:2;letter-spacing:.04em;color:#4a5080;font-weight:400}
  #start .card p,#modal .card p{text-align:center}
  #lot .lab,#catch .lab{font-size:13px;font-weight:400;letter-spacing:.14em;color:#8087b3}
  .topbar{padding-bottom:14px;border-bottom:1px solid var(--line)}
  #lot .card button.go,#catch .card button.go,#start .card button.go,#modal .card button.go{align-self:center;border:0;border-radius:999px;clip-path:none;min-width:150px;padding:0 34px;height:48px;line-height:48px;
    font-family:var(--sf);font-size:16px;font-weight:700;letter-spacing:.24em;text-indent:.24em;color:#fff;
    background:linear-gradient(180deg,#ec8398 0,#d4607a 100%);box-shadow:0 8px 18px -6px rgba(212,96,122,.65),inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 0 rgba(150,40,70,.18);
    transition:transform .15s ease-out,box-shadow .15s ease-out,filter .15s}
  #lot .card button.go:hover,#catch .card button.go:hover,#start .card button.go:hover,#modal .card button.go:hover{transform:translateY(-1px);filter:brightness(1.05);box-shadow:0 12px 22px -6px rgba(212,96,122,.7),inset 0 1px 0 rgba(255,255,255,.5)}
  #lot .card button.go:active,#catch .card button.go:active,#start .card button.go:active,#modal .card button.go:active{transform:translateY(1px) scale(.98);box-shadow:0 4px 10px -4px rgba(212,96,122,.6),inset 0 1px 0 rgba(255,255,255,.4)}
  #catch .card button.ghost{border:1px solid var(--line);border-radius:999px;clip-path:none;height:44px;padding:0 24px;font-family:var(--sf);font-size:14px;letter-spacing:.16em;color:#4a5080;background:rgba(255,255,255,.7);box-shadow:none;transition:background .15s,transform .15s}
  #catch .card button.ghost:hover{background:#fff0f3}
  #catch .card button.ghost:active{transform:scale(.96);box-shadow:none}
  #lot .x,#catch .x{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;clip-path:none;box-shadow:none;padding:0;background:#fff;color:#6b72a6;font-size:15px;transition:background .15s,transform .15s}
  #lot .x:hover,#catch .x:hover{background:#fff0f3}
  #lot .x:active,#catch .x:active{transform:scale(.92);box-shadow:none}
  .slip{position:relative}
  #lot .slip,#catch .slip{border:0;border-radius:10px;padding:26px 22px 20px;gap:12px;
    background:linear-gradient(180deg,#fffaf0,#fdf0e0);
    box-shadow:0 14px 28px -14px rgba(120,80,40,.45),inset 0 0 0 1px rgba(201,162,74,.55),inset 0 0 0 6px #fffaf0,inset 0 0 0 7px rgba(201,162,74,.35)}
  #lot .slip::before,#catch .slip::before{content:"";position:absolute;left:50%;top:-1px;width:64px;height:7px;transform:translateX(-50%);border-radius:0 0 8px 8px;background:linear-gradient(90deg,#e8798a,#f4a0aa)}
  #lot .slip h2,#catch .slip h2{text-align:center;color:var(--rose);letter-spacing:.14em;padding-left:.14em;font-size:22px;line-height:1.5}
  #lot .card img.pic,#catch .card img.pic,#start .card img.pic,#modal .card img.pic{border:0;border-radius:14px;image-rendering:auto;background:#eaf4fb;box-shadow:0 10px 24px -12px rgba(44,48,86,.5),0 0 0 1px rgba(62,68,120,.1)}
  #catch .namebox input{height:50px;font-family:var(--sf);font-size:17px;letter-spacing:.06em;text-align:center;color:#3e4478;background:#fff;border:1px solid var(--line);border-radius:14px;padding:0 16px;box-shadow:inset 0 2px 4px rgba(62,68,120,.06);transition:border-color .15s,box-shadow .15s}
  #catch .namebox input:focus{outline:0;border-color:var(--rose-lt);box-shadow:0 0 0 4px rgba(240,143,162,.22)}
  #catch .namebox .lab{text-align:center}
  #catch .board{border:1px solid var(--line);border-radius:14px;background:#fff;max-height:min(46vh,330px)}
  #catch .board li{grid-template-columns:2.4em 1fr auto;padding:11px 16px;font-size:15px;border-bottom:1px solid rgba(217,100,126,.12);color:#3e4478}
  #catch .board .rk{font-family:var(--serif);font-weight:700;color:#8087b3}
  #catch .board li:nth-child(-n+3) .rk{width:26px;height:26px;line-height:26px;border-radius:50%;color:#fff;font-size:14px;justify-self:center;background:linear-gradient(180deg,#e6c46a,#c9a24a)}
  #catch .board li:nth-child(2) .rk{background:linear-gradient(180deg,#cfd3e0,#9aa1b8)}
  #catch .board li:nth-child(3) .rk{background:linear-gradient(180deg,#e0a27c,#b87650)}
  #catch .board .sc{font-family:var(--serif);font-weight:700;color:var(--rose)}
  #catch .board li.me{background:#fff0f3;box-shadow:inset 3px 0 0 var(--rose)}
  #catch .chud{padding:0 2px 10px;font-weight:400}
  #catch .chud>span{display:inline-flex;align-items:baseline;gap:6px;height:34px;padding:0 14px;align-items:center;border-radius:999px;background:#fff;box-shadow:0 0 0 1px var(--line);font-size:13px;letter-spacing:.1em;color:#6b72a6}
  #catch .chud b{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--rose)}
  #catch #cLives{min-width:0;letter-spacing:3px;color:var(--rose);font-size:15px}
  #catch #cTime{color:#4a5080;font-family:var(--serif);font-size:16px;font-weight:700}
  #cCv,#lotCv{image-rendering:auto;border:0;border-radius:16px;box-shadow:0 12px 26px -14px rgba(44,48,86,.55),0 0 0 1px rgba(62,68,120,.12)}
  #catch .big{font-family:var(--serif);font-weight:700;font-size:54px;letter-spacing:.04em;color:var(--rose)}
  #catch .ctip{font-size:12px;letter-spacing:.14em;color:#8d93bb}
  #lResult .flw{image-rendering:auto;filter:drop-shadow(0 10px 14px rgba(217,100,126,.35))}
  .tw .rest{visibility:hidden}
  .mrow{display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer;font-size:15px;color:#4a5080;letter-spacing:.1em}
  .mrow input{position:absolute;opacity:0;pointer-events:none}
  .mrow .sw{position:relative;width:46px;height:26px;border-radius:999px;background:#cfd3e6;box-shadow:inset 0 1px 3px rgba(44,48,86,.25);transition:background .2s}

function parseCSV(text){
  const rows=[]; let row=[], cell="", q=false;
  text = text.replace(/^\uFEFF/,"");
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===","){ row.push(cell); cell=""; }
    else if(c==="\n"||c==="\r"){ if(c==="\r"&&text[i+1]==="\n")i++; row.push(cell); rows.push(row); row=[]; cell=""; }
    else cell+=c;
  }
  if(cell!==""||row.length){ row.push(cell); rows.push(row); }
  return rows;
}
const HEAD = {"類型":"type","type":"type","名稱":"name","name":"name","x":"x","y":"y",

  "角色":"player","player":"player","npc":"npc","人物":"npc","事件":"event","event":"event",
  "籤":"lot","lot":"lot","掉落物":"drop","drop":"drop","結局":"ending","ending":"ending"};

const GAMES = {"抽籤":"lot","lot":"lot","接接樂":"catch","接捧花":"catch","catch":"catch"};
function rowsToData(rows){
  if(!rows.length) return [];
  const keys = rows[0].map(h => HEAD[h.replace(/^\uFEFF/,"").trim().toLowerCase()] || null);
  const out=[];
  for(const r of rows.slice(1)){
    const o={};
    keys.forEach((k,i)=>{ if(k) o[k]=(r[i]||"").trim(); });
    o.type = TYPE[(o.type||"").toLowerCase()];
    if(!o.type) continue;
    o.x = parseFloat(o.x); o.y = parseFloat(o.y);
    o.value = parseFloat(o.value); o.weight = parseFloat(o.weight);
    o.lose = parseFloat(o.lose) > 0;
    o.game = GAMES[(o.game||"").toLowerCase()] || "";
    out.push(o);
  }
  return out;
}
async function loadData(){
  const url = new URLSearchParams(location.search).get("sheet") || SHEET_CSV_URL;
  if(!url){
    if(EMBEDDED_CSV.trim()){ const d=rowsToData(parseCSV(EMBEDDED_CSV)); if(d.length) return d; }
    return normalizeSample();
  }
  try{
    const res = await fetch(url);
    if(!res.ok) throw new Error(res.status);
    const data = rowsToData(parseCSV(await res.text()));
    if(!data.length) throw new Error("empty");
    return data;
  }catch(e){
    toast("讀不到試算表，先顯示內建範例。請確認有「發布到網路」並選 CSV 格式。");
    if(EMBEDDED_CSV.trim()){ const d=rowsToData(parseCSV(EMBEDDED_CSV)); if(d.length) return d; }
    return normalizeSample();
  }
}

const at=(x,y)=> (y>=0&&y<ROWS&&x>=0&&x<COLS)? GRID[y][x] : "#";
const isBlocked=(tx,ty)=> SOLID.includes(at(tx,ty));
function freeNear(x,y){
  const rx=Math.round(x), ry=Math.round(y);
  if(!isBlocked(rx,ry)) return [x,y];
  let best=null, bd=1e9;
  for(let r=1;r<=6&&!best;r++) for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){
    if(Math.max(Math.abs(dx),Math.abs(dy))!==r) continue;
    const tx=rx+dx, ty=ry+dy;
    if(tx<1||ty<1||tx>COLS-2||ty>ROWS-1||isBlocked(tx,ty)) continue;
    const d=Math.hypot(dx,dy); if(d<bd){bd=d;best=[tx,ty];}
  }
  return best||START;
}

function buildWorld(){
  const ch = players[chosen] || {};
  player.cat = chosen; player.img = loadImg(ch.icon);
  player.x=START[0]; player.y=START[1]; player.face=1; player.moving=false;
  if(isFinite(ch.x)&&isFinite(ch.y)){ [player.x,player.y]=freeNear(ch.x,yShift(ch.y)); }

  let npcIdx=0;
  spots = DATA.filter(d=>(d.type==="event"||d.type==="npc") && isFinite(d.x) && isFinite(d.y)).map((d0,i)=>{
    const d = {...d0, y:yShift(d0.y)};
    const isNpc = d.type==="npc";
    // 事件點放在擋路的格子上（例如神社）時照原位置放，只要旁邊有能走的格子、玩家走得到；其他情況才自動挪開
    const rx=Math.round(d.x), ry=Math.round(d.y);
    const stay = !isNpc && isBlocked(rx,ry) && [[1,0],[-1,0],[0,1],[0,-1]].some(([a,b])=>!isBlocked(rx+a,ry+b));
    const [x,y] = stay ? [d.x,d.y] : freeNear(d.x,d.y);
    return {
      id:i, kind:d.type, key:d.type+"|"+d.name, name:d.name||"？", x, y, text:d.text||"",
      popup: d.image, game: d.game||"", lot:null,

      robe: isNpc ? npcIdx++ : 0,
      dist: isNpc ? NPC_DIST : EVENT_DIST,
      seen: seenSet.has(d.type+"|"+d.name)

  });
  updateFound(); snapCam();
  openSpot = spots.find(s=>Math.hypot(player.x-s.x,player.y-s.y)<s.dist) || null;
}

function rect(g,col,x,y,w,h){ g.fillStyle=col; g.fillRect(x,y,w,h); }
function circ(g,col,x,y,r){ g.fillStyle=col; g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill(); }
function ell(g,col,x,y,rx,ry){ g.fillStyle=col; g.beginPath(); g.ellipse(x,y,rx,ry,0,0,Math.PI*2); g.fill(); }
function poly(g,col,pts,edge){ g.fillStyle=col; g.beginPath(); g.moveTo(pts[0][0],pts[0][1]); for(let i=1;i<pts.length;i++) g.lineTo(pts[i][0],pts[i][1]); g.closePath(); g.fill(); if(edge){ g.strokeStyle=edge; g.lineWidth=1.5; g.stroke(); } }

/* ---------- 像素畫工具：全部用整數格子、不用圓弧，邊緣才會銳利 ---------- */
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){ r=Math.min(r,w/2,h/2); this.moveTo(x+r,y); this.arcTo(x+w,y,x+w,y+h,r); this.arcTo(x+w,y+h,x,y+h,r); this.arcTo(x,y+h,x,y,r); this.arcTo(x,y,x+w,y,r); this.closePath(); };
}
const ri = Math.round;
function R(g,c,x,y,w,h){ g.fillStyle=c; g.fillRect(ri(x),ri(y),ri(w),ri(h)); }                 // 方塊
function D(g,c,cx,cy,r){ g.fillStyle=c; cx=ri(cx); cy=ri(cy); const rr=(r+.5)*(r+.5);          // 圓（一行一行排出來）
  for(let dy=-r;dy<=r;dy++){ const hw=Math.floor(Math.sqrt(Math.max(0,rr-dy*dy))); g.fillRect(cx-hw,cy+dy,hw*2+1,1); } }
function E(g,c,cx,cy,rx,ry){ g.fillStyle=c; cx=ri(cx); cy=ri(cy);                              // 橢圓
  for(let dy=-ry;dy<=ry;dy++){ const k=1-(dy*dy)/((ry+.5)*(ry+.5)), hw=Math.floor(rx*Math.sqrt(Math.max(0,k))+.5); g.fillRect(cx-hw,cy+dy,hw*2+1,1); } }
function P(g,c,pts){ g.fillStyle=c;                                                              // 多邊形（掃描線）
  let y0=1e9,y1=-1e9; pts.forEach(p=>{ y0=Math.min(y0,p[1]); y1=Math.max(y1,p[1]); }); y0=ri(y0); y1=ri(y1);
  for(let y=y0;y<y1;y++){ const yy=y+.5, xs=[];
    for(let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length]; if((a[1]<=yy&&b[1]>yy)||(b[1]<=yy&&a[1]>yy)) xs.push(a[0]+(yy-a[1])/(b[1]-a[1])*(b[0]-a[0])); }
    xs.sort((m,n)=>m-n); for(let i=0;i+1<xs.length;i+=2){ const xa=ri(xs[i]), xb=ri(xs[i+1]); if(xb>xa) g.fillRect(xa,y,xb-xa,1); } } }
function RR(g,c,x,y,w,h){ g.fillStyle=c; g.fillRect(x+1,y,w-2,h); g.fillRect(x,y+1,w,h-2); }    // 切角方塊
function stone(g,x,y,w,h){ RR(g,N.stoneDk,x,y+1,w,h-1); RR(g,N.stone,x,y,w,h-1); R(g,N.stoneLt,x+1,y+1,Math.max(1,w-4),1); }
function dith(g,c,x,y,w,odd){ g.fillStyle=c; for(let i=0;i<w;i++) if(((i+odd)&1)===0) g.fillRect(x+i,y,1,1); }   // 棋盤網點
const mk = (w,h,fn)=>{ const c=document.createElement("canvas"); c.width=w; c.height=h; fn(c.getContext("2d")); return c; };
const flipC = c=>mk(c.width,c.height,g=>{ g.translate(c.width,0); g.scale(-1,1); g.drawImage(c,0,0); });
const fromRows = (rows,pal)=>mk(rows[0].length,rows.length,g=>{ rows.forEach((r,y)=>{ for(let x=0;x<r.length;x++){ const c=pal[r[x]]; if(c){ g.fillStyle=c; g.fillRect(x,y,1,1); } } }); });

function shadeUnder(g,x,y,px,py,c){       // 屋簷／木廊下面：兩排網點的陰影
  const a=at(x,y-1);
  if(a==="w"||a==="H"||a==="M"){ R(g,c,px,py,LT,1); dith(g,c,px,py+1,LT,0); }
}
function grassBaseOld(g,x,y,px,py){
  R(g,N.grass,px,py,LT,LT);
  for(let i=0;i<3;i++) R(g, rnd(x,y,i)<.5?N.grassLt:N.grassDk, px+ri(rnd(x,y,i+3)*11), py+ri(rnd(x,y,i+6)*14), 3+ri(rnd(x,y,i+9)*2), 1);
  for(let i=0;i<3;i++){ const bx=px+1+ri(rnd(x,y,20+i)*12), by=py+2+ri(rnd(x,y,30+i)*11);   // 小草
    R(g,N.blade,bx,by,1,1); R(g,N.blade,bx+2,by,1,1); R(g,N.blade,bx+1,by+1,1,1); }
  if(rnd(x,y,40)<.3){ const fx=px+2+ri(rnd(x,y,41)*11), fy=py+2+ri(rnd(x,y,42)*10); R(g,rnd(x,y,43)<.5?N.white:N.goldLt,fx,fy,1,1); R(g,N.blade,fx,fy+1,1,1); }
  shadeUnder(g,x,y,px,py,N.grassDk);
}
function gravelBaseOld(g,x,y,px,py){
  R(g,N.gravel,px,py,LT,LT);
  for(let k=0;k<4;k++){ const by=py+2+k*4; for(let u=0;u<LT;u++){ const w=ri(Math.sin((px+u)/3.2+k*.9)*.9); R(g,N.rake,px+u,by+w,1,1); } }   // 枯山水耙紋
  for(let i=0;i<4;i++) R(g,N.gravelDk,px+ri(rnd(x,y,50+i)*15),py+ri(rnd(x,y,60+i)*15),1,1);
  if(rnd(x,y,70)<.12) stone(g,px+4+ri(rnd(x,y,71)*5),py+5+ri(rnd(x,y,72)*4),6,4);
  if(at(x-1,y)==="g") R(g,N.gravelDk,px,py,1,LT);
  if(at(x+1,y)==="g") R(g,N.gravelDk,px+LT-1,py,1,LT);
  if(at(x,y-1)==="g") R(g,N.gravelDk,px,py,LT,1);
  if(at(x,y+1)==="g") R(g,N.gravelDk,px,py+LT-1,LT,1);
  shadeUnder(g,x,y,px,py,N.gravelDk);
}
function pathBaseOld(g,x,y,px,py){          // 踏石小徑
  gravelBase(g,x,y,px,py);
  [[1,1,6,6],[9,1,6,5],[2,9,6,6],[9,8,5,6]].forEach(([a,b,w,h],i)=>{
    const jx=ri((rnd(x,y,80+i)-.5)*2), jy=ri((rnd(x,y,90+i)-.5)*2);
    stone(g,px+a+jx,py+b+jy,w,h);
    if(rnd(x,y,100+i)<.3) R(g,N.moss,px+a+jx+w-3,py+b+jy+h-2,1,1);
  });
}
function woodFloorOld(g,x,y,px,py,base,lt){
  R(g,base,px,py,LT,LT);
  for(let k=0;k<4;k++){ const yy=py+k*4;
    R(g,lt,px,yy,LT,1); R(g,N.woodDk,px,yy+3,LT,1);
    R(g,N.woodDk,px+1+((x*7+y*13+k*5)%13),yy+1,1,2);            // 木板接縫
    R(g,N.grain,px+1+((x*5+k*9+y*3)%9),yy+2,3,1);               // 木紋
  }
}
function waterTile(g,x,y,px,py,t){
  R(g,N.water,px,py,LT,LT);
  if(!isWater(x-1,y)) R(g,N.waterDk,px,py,2,LT);
  if(!isWater(x+1,y)) R(g,N.waterDk,px+LT-2,py,2,LT);
  if(!isWater(x,y-1)) R(g,N.waterDk,px,py,LT,2);
  if(!isWater(x,y+1)) R(g,N.waterDk,px,py+LT-2,LT,2);
  const ph=Math.floor((reduceMotion()?0:t)*1.2);
  [[2,5],[8,11],[9,3]].forEach(([a,b],i)=>{                      // 水紋（會一閃一閃換位置）
    if((ph+i+x+y)%3===0) return;
    R(g,N.waterLt,px+a,py+b,1,1); R(g,N.waterLt,px+a+1,py+b+1,3,1); R(g,N.waterLt,px+a+4,py+b,1,1);
  });
  if(rnd(x,y,110)<.45){                                          // 睡蓮
    const lx=px+3+ri(rnd(x,y,111)*7), ly=py+4+ri(rnd(x,y,112)*6);
    E(g,N.leafDk,lx+2,ly+1,3,1); E(g,N.leaf,lx+2,ly,3,1); R(g,N.water,lx+4,ly,2,1);
    if(rnd(x,y,113)<.5){ R(g,N.sakura,lx+1,ly-1,2,1); R(g,N.white,lx+1,ly-2,1,1); }
  }
  if(at(x,y)==="W"){                                             // 岸邊石頭
    if(!isWater(x,y-1)) for(let i=0;i<3;i++) stone(g,px+1+i*5,py+(i%2),5,4);
    if(!isWater(x,y+1)) for(let i=0;i<3;i++) stone(g,px+1+i*5,py+LT-4-(i%2),5,4);
    if(!isWater(x-1,y)) for(let i=0;i<3;i++) stone(g,px+(i%2),py+1+i*5,4,5);
    if(!isWater(x+1,y)) for(let i=0;i<3;i++) stone(g,px+LT-4-(i%2),py+1+i*5,4,5);
  }
}
/* 榻榻米：兩格一張，對齊成整齊的格子（每一段連續的地板從左邊開始數） */
const FLOORCH="tZTBCDRY";
const isFloor = c => !!c && FLOORCH.includes(c);
function tatamiBaseOld(g,x,y,px,py){
  R(g,N.tatami,px,py,LT,LT);
  let s0=x; while(isFloor(at(s0-1,y))) s0--;
  const Lf=((x-s0)%2===0);
  dith(g,N.tatamiDk,px+1,py+5,LT-2,(x+1)&1); dith(g,N.tatamiDk,px+1,py+10,LT-2,x&1);
  R(g,N.tea,px,py,LT,1); R(g,N.tea,px,py+LT-1,LT,1);                 // 榻榻米邊的布條
  R(g,N.tatamiDk,Lf?px:px+LT-1,py+1,1,LT-2);

function resize(){

  if(big){ sc=0; for(let s=Math.max(1,Math.round(1.6*dpr)); s>=1; s--) if(fits(s)){ sc=s; break; } if(!sc) sc=Math.max(1,Math.round(1.2*dpr)); }   // 電腦：挑放得下整張地圖的最大倍數

/* ---------- 移動與觸發 ---------- */
function solidAt(x,y){
  const m=0.22, pts=[[x-m,y+0.05],[x+m,y+0.05],[x-m,y+0.35],[x+m,y+0.35]];
  if(pts.some(([px,py])=>isBlocked(Math.floor(px+0.5),Math.floor(py+0.5)))) return true;
  return spots.some(s=>s.kind==="npc" && Math.hypot(x-s.x,(y+0.2)-s.y)<NPC_RADIUS);
}
function update(dt){
  time+=dt; fxUpdate(dt); camStep(dt);
  if(paused) return;
  let dx=(keys.right?1:0)-(keys.left?1:0), dy=(keys.down?1:0)-(keys.up?1:0);
  player.moving=!!(dx||dy);
  if(player.moving){
    const l=Math.hypot(dx,dy); dx=dx/l*SPEED*dt; dy=dy/l*SPEED*dt;
    if(dx) player.face=dx>0?1:-1;
    stepT-=dt; if(stepT<=0){ stepT=.46; playStep(); }
    dustT-=dt; if(dustT<=0 && !reduceMotion()){ dustT=.13; DUST.push({x:player.x*T+T/2+(Math.random()-.5)*8,y:player.y*T+T/2+16,t:0}); }
    if(!solidAt(player.x+dx,player.y)) player.x+=dx;
    if(!solidAt(player.x,player.y+dy)) player.y+=dy;
  }
  let near=null, nd=1e9;
  for(const s of spots){ const d=Math.hypot(player.x-s.x,player.y-s.y); if(d<s.dist && d<nd){ near=s; nd=d; } }
  if(near && near!==openSpot){ openSpot=near; trigger(near); }
  if(!near) openSpot=null;
}
/* 依「觸發遊戲」決定要開哪個畫面；沒有（或還沒做好）就是普通彈窗 */

function flowerBody(i){

/* 捧花（像素版）：畫在小畫布上，點到哪朵花就抽哪朵 */
const LOT_W=170, LOT_H=193, LOT_S=LOT_W/300, LOT_Q=3;   // LOT_Q：畫布解析度倍數（平滑畫法，不用像素）
let lotSt=null, lotRAF=0, lotLast=0;
function drawFlowerC(g,i){
  const k=i%FL_COLORS.length, [pc,cc]=FL_COLORS[k], n=[5,6,5,8,6,5][k], rr=[17,16,18,15,17,16][k], pr=[13,11,14,9,12,13][k];
  g.lineWidth=2; g.strokeStyle="rgba(62,68,120,.55)";
  for(let j=0;j<n;j++){ const a=j*2*Math.PI/n-Math.PI/2; g.fillStyle=pc; g.beginPath(); g.arc(rr*Math.cos(a),rr*Math.sin(a),pr,0,7); g.fill(); g.stroke(); }
  g.fillStyle="rgba(255,255,255,.4)";
  for(let j=0;j<n;j++){ const a=(j+.5)*2*Math.PI/n-Math.PI/2; g.beginPath(); g.arc(rr*.55*Math.cos(a),rr*.55*Math.sin(a),pr*.6,0,7); g.fill(); }
  g.fillStyle=cc; g.beginPath(); g.arc(0,0,8,0,7); g.fill(); g.stroke();
}
const flPix={};
function flowerPixelUri(i){     // 抽出來那朵花的像素小圖
  const k=i%FL_COLORS.length; if(flPix[k]) return flPix[k];
  const c=document.createElement("canvas"); c.width=c.height=176; const g=c.getContext("2d");
  g.setTransform(176/76,0,0,176/76,88,88); drawFlowerC(g,i); g.setTransform(1,0,0,1,0,0);
  return flPix[k]=c.toDataURL();
}
function lotDrawOrder(){ return lotSt.cards.filter(c=>!c.done||c.pull).sort((a,b)=>lotSt.pos[b.i].r-lotSt.pos[a.i].r); }
function lotDraw(){
  const st=lotSt, g=st.g, t=st.t;
  g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,LOT_W*LOT_Q,LOT_H*LOT_Q); g.fillStyle=C.bluePale; g.fillRect(0,0,LOT_W*LOT_Q,LOT_H*LOT_Q);
  g.setTransform(LOT_S*LOT_Q,0,0,LOT_S*LOT_Q,0,0);
  const order=lotDrawOrder();
  g.fillStyle="rgba(62,68,120,.15)"; g.beginPath(); g.ellipse(150,332,40,6,0,0,7); g.fill();
  g.strokeStyle="#8fc9a4"; g.lineWidth=3.2; g.lineCap="round";
  order.forEach(c=>{ if(c.pull) return; const p=st.pos[c.i]; g.stroke(new Path2D(`M${p.x} ${p.y} Q${(p.x+150)/2} ${p.y+60} 150 250`)); });
  const fillStroke=(d,f,sc,w)=>{ const pp=new Path2D(d); g.fillStyle=f; g.fill(pp); g.strokeStyle=sc; g.lineWidth=w; g.lineJoin="round"; g.stroke(pp); };
  fillStroke("M70 158 L230 158 L166 328 L134 328 Z",C.blueDeep,C.skyDeep,1.5);
  fillStroke("M58 178 L150 206 L242 178 L166 328 L134 328 Z",C.pinkPale,C.pink,2);
  g.strokeStyle=C.pink; g.lineWidth=1.5; g.beginPath(); g.moveTo(150,206); g.lineTo(150,328); g.stroke();
  g.fillStyle="rgba(255,255,255,.9)"; [[88,208],[112,262],[192,240],[210,200],[160,300]].forEach(([x,y])=>{ g.beginPath(); g.arc(x,y,3,0,7); g.fill(); });
  fillStroke("M101 258 L199 258 L196 271 L104 271 Z",C.pinkDeep,C.white,1.5);
  fillStroke("M150 265 C128 246 112 256 120 276 C128 286 146 276 150 265 Z M150 265 C172 246 188 256 180 276 C172 286 154 276 150 265 Z",C.pink,C.white,1.5);
  fillStroke("M148 270 L138 306 L150 298 L156 310 L153 270 Z",C.pinkDeep,C.white,1.2);
  g.fillStyle=C.pinkDeep; g.beginPath(); g.arc(150,266,6,0,7); g.fill(); g.strokeStyle=C.white; g.lineWidth=1.5; g.stroke();
  order.forEach(c=>{
    const p=st.pos[c.i], sc0=1.02-.2*p.r, rot=((c.i*47)%40-20)*Math.PI/180, still=reduceMotion();
    let dx=still?0:Math.sin(t*1.7+c.i*.9)*1.6, dy=still?0:Math.cos(t*1.3+c.i*.6)*1.1, r2=still?0:Math.sin(t*1.5+c.i*.7)*.05, sc=sc0, al=1;
    if(st.sel===c.i && !c.pull) sc*=1.16;
    if(c.pull){ const k=Math.min(1,c.pull.t/.5), e=1-Math.pow(1-k,3); dy-=70*e; sc*=1+.6*e; r2+=.42*e; al=1-k; }
    g.save(); g.globalAlpha=al; g.translate(p.x+dx,p.y+dy); g.rotate(rot+r2); g.scale(sc,sc);

  });

}
function lotLoop(now){
  if(!lotSt || $("lot").hidden || $("lPick").hidden){ lotRAF=0; return; }
  const dt=Math.min(.05,(now-lotLast)/1000); lotLast=now; lotSt.t+=dt;
  for(const c of lotSt.cards){ if(c.pull){ c.pull.t+=dt; if(!c.pull.fin && c.pull.t>=.5){ c.pull.fin=true; const cc=c; setTimeout(()=>{ delete cc.pull; lotBusy=false; drawLot(cc); },reduceMotion()?0:30); } } }
  lotDraw(); lotRAF=requestAnimationFrame(lotLoop);
}
function lotPoint(e){ const r=lotSt.cv.getBoundingClientRect(); return [(e.clientX-r.left)/r.width*300,(e.clientY-r.top)/r.height*340.6]; }
function lotHit(e){
  const [x,y]=lotPoint(e), order=lotDrawOrder().filter(c=>!c.pull).reverse();
  for(const c of order){ const p=lotSt.pos[c.i]; if(Math.hypot(x-p.x,y-p.y)<=30) return c; }
  return null;
}
function showBouquet(){
  const box=$("lFlowers"); box.innerHTML="";
  if(!lotLeft()){ $("lDoneText").textContent=paramText("抽籤抽完文字","捧花都抽完了！"); lotView("done"); return; }
  const deck=lotSpot.lot, cvs=document.createElement("canvas");
  cvs.id="lotCv"; cvs.width=LOT_W*LOT_Q; cvs.height=LOT_H*LOT_Q; cvs.tabIndex=0; cvs.setAttribute("role","application"); cvs.setAttribute("aria-label","捧花。點一朵花抽籤，鍵盤可用左右鍵選花、Enter 抽出");
  deck.forEach(c=>{ if(c.lot.icon && !c.img) c.img=loadImg(c.lot.icon); });
  lotSt={cv:cvs,g:cvs.getContext("2d",{willReadFrequently:true}),cards:deck,pos:bouquetLayout(deck.length),sel:-1,t:0};
  cvs.addEventListener("pointermove",e=>{ const h=lotHit(e); lotSt.sel=h?h.i:-1; });
  cvs.addEventListener("pointerleave",()=>{ lotSt.sel=-1; });
  cvs.addEventListener("pointerdown",e=>{ e.preventDefault(); const h=lotHit(e); if(h) pickFlower(h); });
  cvs.addEventListener("keydown",e=>{
    const live=lotSt.cards.filter(c=>!c.done).sort((a,b)=>lotSt.pos[a.i].x-lotSt.pos[b.i].x||lotSt.pos[a.i].y-lotSt.pos[b.i].y);
    if(!live.length) return;
    const idx=live.findIndex(c=>c.i===lotSt.sel);
    if(e.key==="ArrowRight"||e.key==="ArrowDown"){ e.preventDefault(); lotSt.sel=live[(idx+1)%live.length].i; }
    else if(e.key==="ArrowLeft"||e.key==="ArrowUp"){ e.preventDefault(); lotSt.sel=live[(idx<=0?live.length:idx)-1].i; }
    else if(e.key==="Enter"||e.key===" "){ e.preventDefault(); const c=live.find(c=>c.i===lotSt.sel); if(c) pickFlower(c); }
  });
  box.append(cvs);
  $("lCount").textContent="剩下 "+lotLeft()+" 朵，點一朵花吧";
  lotView("pick");
  cancelAnimationFrame(lotRAF); lotLast=performance.now(); lotRAF=requestAnimationFrame(lotLoop);
}
let lotBusy=false;
function pickFlower(card){
  if(lotBusy||card.done) return;
  lotBusy=true; card.done=true; card.pull={t:0}; lotSt.sel=-1; sfx("pick");
  $("lCount").textContent=lotLeft()?"剩下 "+lotLeft()+" 朵":"最後一朵！";
}
function drawLot(card){

   掉落物（類型「掉落物」）：數值＝加減分、權重＝出現機率、扣命＝接到扣一條命、圖示網址＝圖
   結局（類型「結局」）：數值＝分數門檻，取「分數 ≥ 門檻」裡最高的那一個

   時間到或生命用完就結束；漏接不扣命；分數最低是 0 */
const SMOOTH_FONT="'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif";
const CW=320, CH=420, BASKET_HALF=38, BASKET_TOP=CH-66;

function catchDrops(){
  let l=DATA.filter(d=>d.type==="drop");
  if(!l.length) l=[{name:"紅包",value:1,weight:5},{name:"金紅包",value:3,weight:1},{name:"粉花",value:2,weight:3},{name:"天藍花",value:2,weight:3},{name:"白花",value:3,weight:1},{name:"空酒瓶",value:-2,weight:3,lose:true}];
  return l.map(d=>({name:d.name||"？",value:isFinite(d.value)?d.value:1,weight:(isFinite(d.weight)&&d.weight>0)?d.weight:1,lose:!!d.lose,text:d.text||"",img:loadImg(d.icon)}));

function catchEndings(){

/* ---------- 音樂與腳步聲 ----------
   把檔案放在網頁旁邊的 audio 資料夾：Senbazuru.mp3、Ripples.mp3、step.mp3（或 .ogg / .wav）。
   沒有放步聲檔的話，會用內建的小氣泡聲代替；沒有放音樂檔就單純沒有音樂。 */
const MUSIC={on:false,list:["audio/Senbazuru.mp3","audio/Ripples.mp3"],i:0,el:null,vol:.35};
let stepT=0, actx=null, stepBuf=null, stepTried=false;
function audioCtx(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(_){ } } if(actx&&actx.state==="suspended") actx.resume(); return actx; }
async function loadStep(){
  if(stepTried) return; stepTried=true; const c=audioCtx(); if(!c) return;
  for(const u of ["audio/step.mp3","audio/step.ogg","audio/step.wav"]){
    try{ const r=await fetch(u); if(!r.ok) continue; stepBuf=await c.decodeAudioData(await r.arrayBuffer()); return; }catch(_){ }
  }
}
function playStep(){
  if(!MUSIC.on) return; const c=audioCtx(); if(!c) return; loadStep();
  const g=c.createGain(); g.connect(c.destination); const now=c.currentTime;
  if(stepBuf){ const s=c.createBufferSource(); s.buffer=stepBuf; s.playbackRate.value=.92+Math.random()*.16; g.gain.value=.5; s.connect(g); s.start(); return; }
  const o=c.createOscillator(); o.type="sine"; const f=380+Math.random()*120;           // 內建的小氣泡聲
  o.frequency.setValueAtTime(f,now); o.frequency.exponentialRampToValueAtTime(f*2.1,now+.07);
  g.gain.setValueAtTime(.0001,now); g.gain.exponentialRampToValueAtTime(.16,now+.01); g.gain.exponentialRampToValueAtTime(.0001,now+.11);
  o.connect(g); o.start(now); o.stop(now+.12);
}

/* ---------- 小遊戲的音效與音樂（全部用瀏覽器內建合成，不需要音檔） ---------- */
function tone(freq,t0,dur,type,vol,to,dest){
  const c=actx; if(!c) return; const o=c.createOscillator(), g=c.createGain();
  o.type=type||"sine"; o.frequency.setValueAtTime(freq,t0); if(to) o.frequency.exponentialRampToValueAtTime(to,t0+dur);
  g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+.012); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g); g.connect(dest||c.destination); o.start(t0); o.stop(t0+dur+.03);
}
const NOTE=n=>523.25*Math.pow(2,n/12);
function sfx(name){
  if(!MUSIC.on) return; const c=audioCtx(); if(!c) return; const n=c.currentTime;
  switch(name){
    case "good": tone(NOTE(7),n,.14,"triangle",.2); tone(NOTE(12),n+.07,.2,"triangle",.18); break;
    case "big": [0,4,7,12,16].forEach((s,i)=>tone(NOTE(s),n+i*.06,.25,"triangle",.17)); tone(NOTE(19),n+.3,.35,"sine",.14); break;
    case "bad": tone(220,n,.25,"sawtooth",.1,110); tone(160,n+.05,.3,"square",.06,80); break;
    case "tick": tone(NOTE(7),n,.09,"sine",.16); break;
    case "go": tone(NOTE(12),n,.12,"triangle",.2); tone(NOTE(19),n+.1,.3,"triangle",.2); break;
    case "end": [12,9,7,4,0].forEach((s,i)=>tone(NOTE(s),n+i*.11,.3,"triangle",.14)); break;
    case "pick": tone(420,n,.09,"sine",.2,900); tone(NOTE(4),n+.08,.12,"sine",.1); break;
    case "reveal": [0,4,7,12].forEach((s,i)=>tone(NOTE(s),n+i*.08,.45,"sine",.15)); tone(NOTE(16),n+.34,.6,"triangle",.1); break;
    case "tap": tone(NOTE(9),n,.06,"sine",.12); break;
  }
}
const MINI={mode:null,timer:0,next:0,step:0,bus:null};
const MINIPAT={
  catch:{bpm:136,mel:[0,2,4,7,4,2,0,null, 5,4,2,4,7,null,4,2, 4,7,9,7,4,2,0,2, 4,2,0,-3,0,null,null,null],bass:[-12,-12,-15,-17]},
  lot:{bpm:78,mel:[4,null,7,null,9,null,7,null, 4,null,2,null,0,null,null,null, 5,null,9,null,12,null,9,null, 7,null,4,null,2,null,null,null],bass:[-12,-15,-17,-12]}
};
function miniTick(){
  const c=actx; if(!c||!MINI.mode){ return; } const P=MINIPAT[MINI.mode], beat=60/P.bpm/2;
  while(MINI.next<c.currentTime+.35){
    const s=MINI.step%32, m=P.mel[s];
    if(m!=null) tone(NOTE(m),MINI.next,MINI.mode==="catch"?.28:.7,"triangle",MINI.mode==="catch"?.12:.1,null,MINI.bus);
    if(s%8===0) tone(NOTE(P.bass[(s/8)|0]),MINI.next,beat*7,"sine",.14,null,MINI.bus);
    if(MINI.mode==="catch" && s%4===2) tone(NOTE(19),MINI.next,.05,"square",.015,null,MINI.bus);
    MINI.next+=beat; MINI.step++;
  }
}
function miniStop(){ clearInterval(MINI.timer); MINI.timer=0; MINI.mode=null; if(MINI.bus){ try{ MINI.bus.disconnect(); }catch(_){ } MINI.bus=null; } }
function miniMusic(mode){        // 進入小遊戲：主旋律暫停、換小遊戲專用的曲子；離開再接回去
  miniStop(); MINI.want=mode;
  if(!mode){ if(MUSIC.on&&MUSIC.el&&MUSIC.el.src) MUSIC.el.play().catch(()=>{}); return; }
  if(MUSIC.el) MUSIC.el.pause();
  if(!MUSIC.on) return; const c=audioCtx(); if(!c) return;
  MINI.mode=mode; MINI.bus=c.createGain(); MINI.bus.gain.value=.7; MINI.bus.connect(c.destination);
  MINI.next=c.currentTime+.15; MINI.step=0; MINI.timer=setInterval(miniTick,90);
}
function bgmNext(){
  if(!MUSIC.on||MINI.want) return; const el=MUSIC.el||(MUSIC.el=new Audio()); el.volume=MUSIC.vol; el.onended=()=>{ MUSIC.i=(MUSIC.i+1)%MUSIC.list.length; if(!MINI.want) bgmNext(); };
  let fails=0; el.onerror=()=>{ if(++fails>=MUSIC.list.length) return; MUSIC.i=(MUSIC.i+1)%MUSIC.list.length; el.src=MUSIC.list[MUSIC.i]; el.play().catch(()=>{}); };
  el.src=MUSIC.list[MUSIC.i]; el.play().catch(()=>{});
}
function setMusic(on){
  MUSIC.on=on; const b=$("musicBtn"); b.setAttribute("aria-pressed",String(on)); b.textContent=on?"音樂：開":"音樂：關";
  if(!on){ if(MUSIC.el) MUSIC.el.pause(); miniStop(); return; }
  audioCtx(); loadStep();
  if(MINI.want){ miniMusic(MINI.want); return; }
  if(MUSIC.el&&MUSIC.el.src) MUSIC.el.play().catch(()=>{}); else bgmNext();
}
document.addEventListener("visibilitychange",()=>{ if(document.hidden){ if(MUSIC.el) MUSIC.el.pause(); if(actx) actx.suspend(); } else if(MUSIC.on){ if(actx) actx.resume(); if(MUSIC.el&&!MINI.want) MUSIC.el.play().catch(()=>{}); } });

  u.searchParams.set("t",Date.now());
  const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),10000);

    const r=await fetch(u,{signal:ctl.signal}); if(!r.ok) throw new Error("http "+r.status);
    const j=await r.json(); if(!j||!j.ok) throw new Error("bad response"); return j;
  } finally { clearTimeout(to); }

  $("cNameBox").hidden=!lbOn(); $("cBoardBtn").hidden=!lbOn();
  if(lbOn()) $("cName").value=getSavedName();
  catchView("intro"); showOv($("catch")); miniMusic("catch"); (lbOn()&&!$("cName").value ? $("cName") : $("cStart")).focus();
}
function closeCatch(){ cancelAnimationFrame(cRAF); CG=null; cKeys.left=cKeys.right=false; hideOv($("catch")); paused=false; miniMusic(null); }
function startCatch(){
  const ds=catchDrops(), lives=Math.max(1,Math.round(paramNum("接接樂生命數",3)));
  CG={ds,total:ds.reduce((a,d)=>a+d.weight,0),time:Math.max(5,paramNum("接接樂秒數",30)),lives,maxLives:lives,
      speed:Math.max(.5,paramNum("掉落速度",5))*55,gap:Math.max(.2,paramNum("掉落間隔",.6)),ramp:Math.max(1,paramNum("最後加速",2.2)),total0:Math.max(5,paramNum("接接樂秒數",30)),f:1,
      score:0,items:[],fx:[],x:CW/2,tx:CW/2,spawn:.3,count:2.4,over:false,flash:0,t:0};
  catchView("play"); catchHud();
  cancelAnimationFrame(cRAF); cLast=performance.now(); cRAF=requestAnimationFrame(catchLoop);
}
function catchHud(){
  if(!CG) return;
  $("cScore").textContent=CG.score; $("cTime").textContent="⏱ "+Math.ceil(CG.time);
  $("cLives").textContent="♥".repeat(Math.max(0,CG.lives))+"♡".repeat(Math.max(0,CG.maxLives-Math.max(0,CG.lives)));
}
function spawnDrop(){
  let r=Math.random()*CG.total, d=CG.ds[0];
  for(const x of CG.ds){ r-=x.weight; if(r<=0){ d=x; break; } }
  CG.items.push({d,x:24+Math.random()*(CW-48),y:-24,vy:CG.speed*(.85+Math.random()*.3),rot:(Math.random()-.5)*.6,rs:(Math.random()-.5)*2});
}
function catchUpdate(dt){
  const G=CG; G.t+=dt; G.flash=Math.max(0,G.flash-dt);
  G.fx.forEach(f=>f.t+=dt); G.fx=G.fx.filter(f=>f.t<.8);
  if(G.count>0){ G.count-=dt; const nn=Math.ceil(G.count-.4); if(nn!==G.lastN){ G.lastN=nn; sfx(nn>0?"tick":"go"); } return; }
  G.time-=dt; if(G.time<=0){ G.time=0; catchHud(); return endCatch(); }
  G.f=1+(G.ramp-1)*Math.min(1,Math.max(0,1-G.time/G.total0));   // 時間越少，掉得越快
  const dir=(cKeys.right?1:0)-(cKeys.left?1:0);
  if(dir) G.tx=Math.max(BASKET_HALF,Math.min(CW-BASKET_HALF,G.tx+dir*320*dt));
  G.x+=(G.tx-G.x)*Math.min(1,dt*22);
  G.spawn-=dt; if(G.spawn<=0){ G.spawn=G.gap/(1+(G.f-1)*.6)*(.75+Math.random()*.5); spawnDrop(); }
  for(const it of G.items){
    it.y+=it.vy*G.f*dt; it.rot+=it.rs*dt;
    if(!it.hit && it.y+14>=BASKET_TOP && it.y-14<=BASKET_TOP+16 && Math.abs(it.x-G.x)<=BASKET_HALF+8){
      it.hit=true; const d=it.d;
      G.score=Math.max(0,G.score+d.value);
      if(d.lose){ G.lives--; G.flash=.35; }
      sfx(d.lose||d.value<0?"bad":(d.value>=3?"big":"good"));
      if(d.value) G.fx.push({x:Math.max(70,Math.min(CW-70,it.x)),y:BASKET_TOP-8,t:0,text:(d.value>0?"+":"")+d.value+(d.text?" "+d.text:""),col:d.value>0?C.pinkDeep:C.skyDeep});
      else if(d.lose) G.fx.push({x:it.x,y:BASKET_TOP-8,t:0,text:"－1♥",col:C.skyDeep});
      catchHud();
      if(G.lives<=0){ G.items=G.items.filter(i=>!i.hit); return endCatch(); }
    }
  }
  G.items=G.items.filter(i=>!i.hit && i.y<CH+30);
  catchHud();
}
function drawDrop(g,d,x,y,rot){
  g.save(); g.translate(x,y); g.rotate(rot);
  if(ready(d.img)){ const h=40,w=h*d.img.naturalWidth/d.img.naturalHeight; g.drawImage(d.img,-w/2,-h/2,w,h); }
  else if(/花/.test(d.name) && !d.lose && d.value>=0){   // 花朵（名稱含「花」就畫成花，之後可換圖）
    const n=d.name, pc=/粉|紅/.test(n)?C.pink:/藍/.test(n)?C.sky:/白/.test(n)?C.white:/橘|黃|金/.test(n)?C.orange:[C.pink,C.sky,C.orange][n.length%3];
    g.strokeStyle="rgba(62,68,120,.35)"; g.lineWidth=1.3;
    for(let k=0;k<5;k++){ const a=k*Math.PI*2/5-Math.PI/2; g.fillStyle=pc; g.beginPath(); g.arc(Math.cos(a)*9,Math.sin(a)*9,8,0,7); g.fill(); g.stroke(); }
    circ(g,/白/.test(n)?C.pink:C.white,0,0,5); g.strokeStyle="rgba(62,68,120,.35)"; g.beginPath(); g.arc(0,0,5,0,7); g.stroke();
  }
  else if(d.lose||d.value<0){          // 空酒瓶
    rect(g,C.blueDeep,-9,-4,18,22); rect(g,C.blue,-9,-4,18,8);
    rect(g,C.blueDeep,-4,-17,8,14); rect(g,C.orangeDeep,-5,-20,10,4);
    g.strokeStyle=C.ink; g.globalAlpha=.35; g.lineWidth=1.4; g.strokeRect(-9,-4,18,22); g.globalAlpha=1;
  } else {                              // 紅包
    const gold=d.value>=3, body=gold?C.orange:C.pinkDeep, edge=gold?C.orangeDeep:"#c85a6c";
    g.fillStyle=body; g.strokeStyle=edge; g.lineWidth=2; g.beginPath(); g.roundRect(-13,-18,26,36,4); g.fill(); g.stroke();
    poly(g,gold?"#fde0bf":C.pink,[[-13,-18],[13,-18],[0,-3]],edge);
    circ(g,gold?C.pinkDeep:C.orange,0,-3,5); circ(g,C.white,0,-3,1.8);
    rect(g,C.white,-6,8,12,2); rect(g,C.white,-4,12,8,2);
  }
  g.restore();
}
function catchDraw(){
  const G=CG, g=cg;
  const bg=g.createLinearGradient(0,0,0,CH); bg.addColorStop(0,C.bluePale); bg.addColorStop(1,C.pinkPale);
  g.fillStyle=bg; g.fillRect(0,0,CW,CH);
  for(let i=0;i<9;i++){ const px=(i*47+G.t*(8+i))%CW, py=(i*83+G.t*(22+i*3))%CH; ell(g,"rgba(255,255,255,.75)",px,py,5,3); }
  G.items.forEach(it=>drawDrop(g,it.d,it.x,it.y,it.rot));
  // 籃子
  const bx=G.x;
  ell(g,"rgba(62,68,120,.18)",bx,CH-18,BASKET_HALF,6);
  poly(g,C.orange,[[bx-BASKET_HALF,BASKET_TOP+4],[bx+BASKET_HALF,BASKET_TOP+4],[bx+BASKET_HALF-9,CH-24],[bx-BASKET_HALF+9,CH-24]],C.orangeDeep);
  g.strokeStyle="rgba(238,174,110,.9)"; g.lineWidth=2;
  for(let k=-3;k<=3;k++){ g.beginPath(); g.moveTo(bx+k*11,BASKET_TOP+8); g.lineTo(bx+k*8,CH-26); g.stroke(); }
  for(let k=0;k<3;k++){ g.beginPath(); g.moveTo(bx-BASKET_HALF+3+k*3,BASKET_TOP+16+k*9); g.lineTo(bx+BASKET_HALF-3-k*3,BASKET_TOP+16+k*9); g.stroke(); }
  rect(g,C.pinkDeep,bx-BASKET_HALF-2,BASKET_TOP,BASKET_HALF*2+4,7); rect(g,C.pink,bx-BASKET_HALF-2,BASKET_TOP,BASKET_HALF*2+4,3);
  // 分數跳字
  g.textAlign="center"; g.font="700 18px "+SMOOTH_FONT; g.lineJoin="round";
  G.fx.forEach(f=>{ g.globalAlpha=1-f.t/.8; g.fillStyle=C.white; g.strokeStyle=f.col; g.lineWidth=4; g.strokeText(f.text,f.x,f.y-f.t*50); g.fillText(f.text,f.x,f.y-f.t*50); });
  g.globalAlpha=1;
  if(G.flash>0){ g.fillStyle=`rgba(232,121,138,${(G.flash/.35)*.35})`; g.fillRect(0,0,CW,CH); }
  if(G.count>0){
    g.fillStyle="rgba(255,253,251,.55)"; g.fillRect(0,0,CW,CH);
    const n=Math.ceil(G.count-.4), frac=(G.count-.4)%1; g.globalAlpha=1;
    g.fillStyle=C.pinkDeep; g.font=(70+Math.max(0,frac)*18)+"px "+SMOOTH_FONT;
    g.fillText(n>0?String(n):"GO!",CW/2,CH/2+20);
  }
}
function catchLoop(now){
  if(!CG||CG.over) return;
  const dt=Math.min(.05,(now-cLast)/1000); cLast=now;
  catchUpdate(dt);
  if(CG&&!CG.over){ catchDraw(); cRAF=requestAnimationFrame(catchLoop); }
}
function endCatch(){
  if(!CG||CG.over) return;
  CG.over=true; cancelAnimationFrame(cRAF); sfx("end");
  const e=pickEnding(CG.score);
  $("cFinal").textContent=CG.score+" 分";
  $("cEName").textContent=e.name||""; $("cEText").textContent=e.text||"";
  const pic=$("cEPic");
  if(e.image){ pic.hidden=false; pic.referrerPolicy="no-referrer"; pic.onerror=()=>{pic.hidden=true}; pic.src=e.image; } else pic.hidden=true;
  catchView("end"); $("cAgain").focus();
  if(lbOn()) submitScore(CG.score);
  else { $("cRank").textContent=""; $("cRetry").hidden=true; $("cBoardBtn2").hidden=true; }
}
function catchPointer(e){ if(!CG) return; const r=cCv.getBoundingClientRect(); CG.tx=Math.max(BASKET_HALF,Math.min(CW-BASKET_HALF,(e.clientX-r.left)/r.width*CW)); }
cCv.addEventListener("pointerdown",e=>{ e.preventDefault(); try{cCv.setPointerCapture(e.pointerId)}catch(_){ } catchPointer(e); });
cCv.addEventListener("pointermove",e=>{ catchPointer(e); });

/* ---------- 選角色 ---------- */
function buildPicker(){
  const cp=$("charPick"); cp.innerHTML="";
  $("charLab").hidden = cp.hidden = players.length<2;
  players.forEach((p,i)=>{
    const b=document.createElement("button"); b.type="button"; b.className="opt"; b.setAttribute("aria-pressed",String(i===chosen));
    let vis; const src=p.icon;
    if(src){ vis=document.createElement("img"); vis.referrerPolicy="no-referrer"; vis.alt=""; vis.src=src; vis.onerror=()=>{vis.style.visibility="hidden"}; }
    else { vis=document.createElement("canvas"); vis.width=80; vis.height=76; { const vg=vis.getContext("2d"); vg.imageSmoothingEnabled=false; vg.drawImage(catSp(i,0),0,0,40,38,0,0,80,76); } }
    const s=document.createElement("span"); s.textContent=p.name||("角色"+(i+1));
    b.append(vis,s);
    b.onclick=()=>{ chosen=i; [...cp.children].forEach(x=>x.setAttribute("aria-pressed",String(x===b))); };
    cp.append(b);
  });
}

/* ---------- 輸入 ---------- */
const KEYMAP={ArrowUp:"up",w:"up",W:"up",ArrowDown:"down",s:"down",S:"down",ArrowLeft:"left",a:"left",A:"left",ArrowRight:"right",d:"right",D:"right"};
addEventListener("keydown",ev=>{
  if(!$("catch").hidden){
    if(ev.key==="Escape"){ ev.preventDefault(); closeCatch(); return; }
    if(ev.target && ev.target.tagName==="INPUT") return;   // 打字時不要當成移動鍵
    const ck=CKEY[ev.key]; if(ck){ cKeys[ck]=true; ev.preventDefault(); }
    return;
  }
  if(!$("lot").hidden){ if(ev.key==="Escape"){ ev.preventDefault(); closeLot(); } return; }
  if(!$("modal").hidden){ if(ev.key==="Escape"||ev.key===" "||ev.key==="Enter"){ ev.preventDefault(); closeModal(); } return; }
  const k=KEYMAP[ev.key]; if(k && !paused){ keys[k]=true; ev.preventDefault(); }
});
addEventListener("keyup",ev=>{ const k=KEYMAP[ev.key]; if(k) keys[k]=false; const ck=CKEY[ev.key]; if(ck) cKeys[ck]=false; });
addEventListener("blur",()=>{ clearKeys(); cKeys.left=cKeys.right=false; });
$("cClose").addEventListener("click",closeCatch);
$("cStart").addEventListener("click",()=>{
  if(lbOn()){
    const n=$("cName").value.trim();
    if(!n){ toast("先輸入名字才能開始喔"); $("cName").focus(); return; }
    lbName=n; saveName(n);
  }
  startCatch();
});
$("cName").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); $("cStart").click(); } });
$("cAgain").addEventListener("click",startCatch);
$("cBoardBtn").addEventListener("click",()=>showBoard("intro"));
$("cBoardBtn2").addEventListener("click",()=>showBoard("end"));
$("cBoardBack").addEventListener("click",()=>{ catchView(lbBack); (lbBack==="intro"?$("cStart"):$("cAgain")).focus(); });
$("cRetry").addEventListener("click",()=>{ if(lbMine) submitScore(lbMine.score); });
document.querySelectorAll("#pad button").forEach(b=>{
  const k=b.dataset.k;
  const on=ev=>{ ev.preventDefault(); if(!paused){ keys[k]=true; b.classList.add("on"); } };
  const off=ev=>{ ev.preventDefault(); keys[k]=false; b.classList.remove("on"); };
  b.addEventListener("pointerdown",on); b.addEventListener("pointerup",off);
  b.addEventListener("pointercancel",off); b.addEventListener("pointerleave",off);
  b.addEventListener("contextmenu",e=>e.preventDefault());
});
$("mClose").addEventListener("click",closeModal);
$("modal").addEventListener("pointerdown",ev=>{ if(ev.target===$("modal")) closeModal(); });
$("lClose").addEventListener("click",closeLot);
$("lOk").addEventListener("click",showBouquet);
$("lAgain").addEventListener("click",()=>{ lotSpot.lot=newDeck(); showBouquet(); });
$("sBtn").addEventListener("click",()=>{ buildWorld(); hideOv($("start")); paused=false; setMusic($("musicChk").checked); });
$("musicBtn").addEventListener("click",()=>setMusic(!MUSIC.on));
document.addEventListener("click",e=>{ if(e.target.closest&&e.target.closest(".card button.go,.card button.ghost")) sfx("tap"); });
$("again").addEventListener("click",()=>{ paused=true; clearKeys(); showOv($("start")); });
addEventListener("resize",resize); addEventListener("orientationchange",()=>setTimeout(resize,200));

/* ---------- 啟動 ---------- */
(async function(){
  DATA = await loadData();
  const set = DATA.find(d=>d.type==="setting"&&d.name) || DATA.find(d=>d.type==="setting") || {};
  const title = set.name || "五悠日和 — 今日、ふたりの日";
  document.title=title; $("title").textContent=title; $("sTitle").textContent=paramText("開場標題",title); $("sHow").textContent=paramText("操作說明","用方向鍵或 WASD 走動，靠近發亮的愛心或站著的人就能看到內容。");
  $("sText").textContent = set.text || "";
  if(set.image){ const c=$("sCover"); c.hidden=false; c.referrerPolicy="no-referrer"; c.onerror=()=>{c.hidden=true}; c.src=set.image; }
  players = DATA.filter(d=>d.type==="player");
  if(!players.length) players=[{name:"貓咪"}];
  buildPicker();
  buildWorld();
  resize();
  let last=performance.now();
  (function loop(now){
    const dt=Math.min(.05,(now-last)/1000); last=now;
    update(dt); draw(); requestAnimationFrame(loop);
  })(last);
})();
</script>
